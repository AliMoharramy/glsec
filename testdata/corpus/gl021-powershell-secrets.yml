# #860: PowerShell secret prints are reported; literals and non-secret names stay clean.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
debug:
  tags: [windows]
  script:
    - Write-Host "token is $env:DEPLOY_TOKEN"
    - echo $env:DEPLOY_TOKEN
    - Write-Output ${ENV:DEPLOY_PASSWORD}
    - Write-Information $env:API_SECRET -InformationAction Continue
    - WrItE $env:SSH_PRIVATE_KEY
    - "Write-Host '$env:DEPLOY_TOKEN'"
    - Write-Host $env:GPG_KEY_ID
    - Write-Output $env:DEPLOY_TOKEN | Set-Content token.txt
    - Write-Host $env:DEPLOY_TOKEN 6> $null
    - Write-Host $env:DEPLOY_TOKEN | Out-Null
